    <script>
      (() => {
        window.__PASSPORT_INITIAL_SEARCH__ = window.location.search;

        const url = new URL(window.location.href);
        const trackingParams = [
          'utm_source',
          'utm_medium',
          'utm_campaign',
          'utm_content',
          'utm_term',
          'from',
          'source',
          'source_site',
          'origin_path',
          'entry_surface',
          'destination_type'
        ];
        // R6: 'email' 一律視為敏感參數清掉（不論是誰帶進來的），避免個資殘留在網址列讓 GA 記到。
        const sensitiveParams = ['claim', 'claim_code', 'reward', 'email'];
        // Gacha → Passport 積分同步參數（?action=add_points&amount=&source=&ts=&device_id=）：
        // 金額、時間戳、device_id 都不該進 GA4 page_location。`source` 已在上面 trackingParams；
        // `amount`／`device_id`／`ts` 在本站沒有其他用途，一律清；`action` 只在值為 add_points 時清。
        // App 端仍讀得到：上面已把清理前的原始 query 存進 window.__PASSPORT_INITIAL_SEARCH__，
        // passportUtils.handleIncomingPointsSync 與 App.tsx 都從那裡讀，不讀被清過的 location.search。
        const pointsSyncParams = ['amount', 'device_id', 'ts'];
        if (url.searchParams.get('action') === 'add_points') {
          pointsSyncParams.push('action');
        }
        // OAuth callback 一定帶非空 state；用 getAll + trim 同時收斂兩個 edge：
        //   - `?state=%20` 純空白 state 不被當成 OAuth state，reward+code 仍會被清
        //   - `?state=&state=REAL` 重複 state 不會被第一個空值矇騙，誤刪真實 OAuth code
        // 與 App.tsx scrubber、oauthSafety.ts 三邊對齊。
        const hasOAuthState = url.searchParams.getAll('state').some((value) => value.trim().length > 0);
        const hasRewardClaimCode = !hasOAuthState && url.searchParams.has('code') && url.searchParams.has('reward');
        const paramsToScrub = hasRewardClaimCode ? [...sensitiveParams, 'code'] : sensitiveParams;
        const hasSensitiveClaimParam = paramsToScrub.some((param) => url.searchParams.has(param));
        const hasTrackingParam = trackingParams.some((param) => url.searchParams.has(param));
        const hasPointsSyncParam = pointsSyncParams.some((param) => url.searchParams.has(param));

        if (hasSensitiveClaimParam || hasTrackingParam || hasPointsSyncParam) {
          trackingParams.forEach((param) => url.searchParams.delete(param));
          pointsSyncParams.forEach((param) => url.searchParams.delete(param));
          paramsToScrub.forEach((param) => url.searchParams.delete(param));
          const nextSearch = url.searchParams.toString();
          window.history.replaceState({}, '', `${url.pathname}${nextSearch ? `?${nextSearch}` : ''}${url.hash}`);
        }

        const privatePath = /^\/(redeem|join|passport)(\/|$)/.test(window.location.pathname);
        const privateQuery = hasSensitiveClaimParam || Array.from(url.searchParams.keys()).length > 0;

        if (privatePath || privateQuery) {
          const robots = document.querySelector('meta[name="robots"]') || document.createElement('meta');
          robots.setAttribute('name', 'robots');
          robots.setAttribute('content', 'noindex,nofollow');
          document.head.appendChild(robots);
        }
      })();
    </script>

    <!-- Google Analytics 4 -->
    <!-- R1: 只在正式網域（kiwimu.com 或其子網域）載入／送資料；localhost、127.0.0.1、
         *.vercel.app 預覽網址一律不載入 gtag，避免污染正式流量數據。 -->
    <script type="module">
      const __hostname = window.location.hostname;
      // v1.1: 舊正式別名（moonmoon-dessert-passport.vercel.app）上有真實使用者流量，一併放行；
      // 其餘 *.vercel.app 預覽網址與 localhost 仍不送資料。
      const __isProdKiwimuHost =
        __hostname === 'kiwimu.com' ||
        __hostname.endsWith('.kiwimu.com') ||
        __hostname === 'moonmoon-dessert-passport.vercel.app';

      if (__isProdKiwimuHost) {
        const gaId = import.meta.env.VITE_GA4_ID || 'G-DM6F27KL8B';
        window.__GA4_ID__ = gaId;

        setTimeout(() => {
          const s = document.createElement('script');
          s.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
          s.async = true;
          document.head.appendChild(s);

          window.dataLayer = window.dataLayer || [];
          function gtag() {
            window.dataLayer.push(arguments);
          }
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', gaId, { send_page_view: true });
        }, 500);
      }
    </script>
